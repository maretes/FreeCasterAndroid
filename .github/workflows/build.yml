name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # щоб створювати релізи для автооновлення

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Немає секрету KEYSTORE_BASE64: APK підписано тимчасовим ключем, реліз для автооновлення не створюється"
          fi
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PbuildNumber=${{ github.run_number }}
          cp app/build/outputs/apk/release/*.apk FreeCaster.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FreeCaster-apk
          path: FreeCaster.apk
      - name: Release
        if: github.ref == 'refs/heads/main' && env.KEYSTORE_PATH != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FreeCaster ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: FreeCaster.apk
          make_latest: true
